<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>GeoBitácora</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <main>
            <header>
                <p>EXPLORACIÓN · CAMPO DIGITAL</p>
                <h1>GeoBitácora</h1>
                <span>● Registro de estación</span>
            </header>

            <form id="registro">
                <section>
                    <h2>01 · Identificación</h2>
                    <div class="grid">
                        <label>Proyecto *<input name="proyecto" required placeholder="Alta Guajira 2026"></label>
                        <label>Estación *<input name="estacion" required placeholder="AG-EST-024"></label>
                        <label>Fecha *<input type="date" name="fecha_campo" required></label>
                        <label>Geólogo responsable *<input name="geologo_nombre" required></label>
                        <label>Correo *<input type="email" name="geologo_email" required></label>
                        <label>Tipo de estudio *
                            <select name="tipo_estudio" required>
                                <option value="">Selecciona</option>
                                <option value="suelo">Suelo</option>
                                <option value="roca">Roca</option>
                                <option value="agua">Agua</option>
                                <option value="otro">Otro</option>
                            </select></label>
                    </div>
                </section>
                
                <section>
                    <h2>02 · Ubicación y muestra</h2>
                    <div class="grid">
                        <label>Latitud<input name="latitud" inputmode="decimal"></label>
                        <label>Longitud<input name="longitud" inputmode="decimal"></label>
                        <label>Elevación m s. n. m.<input name="elevacion_m" inputmode="decimal"></label>
                        <label>Código de muestra<input name="codigo_muestra"></label>
                        <label>Material / muestra<input name="material"></label>
                        <label>Urgencia declarada
                            <select name="prioridad_declarada">
                                <option value="baja">Baja</option>
                                <option value="media" selected>Media</option>
                                <option value="alta">Alta</option>
                            </select>
                        </label>
                    </div>
                    <button type="button" id="gps">Usar ubicación actual</button>
                </section>
                
                <section>
                    <h2>03 · Hallazgo</h2>
                    <div class="grid two">
                        <label>Descripción *
                            <textarea name="descripcion" required placeholder="Litología, condición del sitio y observaciones."></textarea>
                        </label>
                        <label>Riesgo observado
                            <textarea name="riesgo_observado" placeholder="Contaminación, inestabilidad, acceso, etc."></textarea>
                        </label>
                    </div>
                    <label>Resultado preliminar<input name="resultado_preliminar"></label>
                    <label>Recomendación<textarea name="recomendacion"></textarea></label>
                </section>
                
                <section>
                    <h2>04 · Evidencia</h2>
                    <label class="file">Adjuntar hasta 5 fotografías
                        <input id="fotos" type="file" name="evidencias" accept="image/jpeg,image/png,image/webp" multiple></label>
                        <small id="resumen">Sin fotos seleccionadas</small>
                </section>
                
                <p id="mensaje"></p>
                <button class="enviar" type="submit">Enviar registro →</button>
            </form>
        </main>
        
        <script src="app.js"></script>
    </body>
</html>
